<div class="form-group">
    <label for="manufacturer">Manufacturer</label>
    <input type="text" id="manufacturer" name="car[manufacturer]" value="{{ car.manufacturer if car else '' }}">
</div>

<div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" name="car[model]" value="{{ car.model if car else '' }}">
</div>

<div class="form-group">
    <label for="color">Color</label>
    <input type="text" id="color" name="car[color]" value="{{ car.color if car else '' }}">
</div>

<div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="year" name="car[year]" value="{{ car.year if car else '' }}">
</div>

{% if car and car.id %}
    <input type="hidden" name="car[id]" value="{{ car.id }}">
{% endif %}

<div class="form-group">
    <label></label>
    <input type="submit" value="Submit">
</div>
